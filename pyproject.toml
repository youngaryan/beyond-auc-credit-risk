[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-auc-credit-risk"
version = "1.0.0"
description = "A reproducible study of credit-risk discrimination, calibration and sampling bias"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "scikit-learn>=1.6,<1.10", "matplotlib>=3.8,<4",
  "reportlab>=4.2,<6", "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
credit-risk = "credit_risk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: verifies the generated full research bundle"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
